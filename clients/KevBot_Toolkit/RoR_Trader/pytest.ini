# pytest configuration — board #239.
#
# This file exists mainly to ANCHOR THE ROOTDIR at the RoR_Trader project root so that
# ./conftest.py is always loaded, including when pytest is invoked from inside `src/`
# (pytest's confcutdir defaults to the rootdir, so without an ini file here a run
# started from `src/` would silently skip the guard that conftest.py installs).
#
# conftest.py refuses to let pytest report success for our script-style acceptance
# suites, which it collects zero items from. Read the docstring there before changing
# anything in this file.
[pytest]
norecursedirs = .venv node_modules .git __pycache__ .next build dist *.egg

# Our suites are normally invoked directly (`python src/test_foo.py`), which puts `src/`
# on sys.path implicitly. Under pytest the rootdir is this directory, so `src/` is NOT on
# the path and 17 suites died at import with ModuleNotFoundError (ralph_engine,
# unified_engine, engine_health, ...). That is collection noise, not a real failure — and
# a run that ends in errors invites the next person to conclude the #239 guard broke
# collection and remove it. `pythonpath` (pytest >= 7) reproduces the direct-invocation
# path so `pytest src/` collects cleanly.
pythonpath = src
